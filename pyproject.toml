[project]
name = "agent-workshop"
version = "0.1.0"
description = "Агентская мастерская: FSM-оркестрируемый конвейер мастерских-агентов (см. user_docs/task_statement.md)"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "mcp>=1.28.1",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
